<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪐 PROJECT Q-O // DUAL TISSUE EXPERIMENT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050508;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-evenly; /* Teilt die beiden Module perfekt auf die Breite auf */
            height: 100vh;
            font-family: 'Courier New', monospace;
            padding: 0 50px;
        }

        /* LINKS: DIE ROHE ROTATIONS-MATRIX */
        #matrix-container {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #matrix-container::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, rgba(15, 16, 22, 0.7) 0%, rgba(10, 11, 15, 0.2) 50%, rgba(0, 0, 0, 0) 100%);
            filter: blur(20px);
            z-index: 1;
        }

        /* RECHTS: DAS BIOMORPHE WIDGET MIT KANTENFREIER LENSE */
        #widget-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }

        #widget-container::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, rgba(15, 16, 22, 0.65) 0%, rgba(10, 11, 15, 0.20) 45%, rgba(1, 0, 5, 0.05) 75%, rgba(0, 0, 0, 0) 100%);
            filter: blur(8px);
            z-index: 1;
            transition: background 0.3s ease;
        }

        svg {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }

        /* FEINES LABOR-OVERLAY */
        #terminal-info {
            position: absolute;
            top: 30px;
            left: 30px;
            color: rgba(0, 255, 200, 0.4);
            font-size: 12px;
            line-height: 1.6;
            pointer-events: none;
        }

        #interaction-alert {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(140, 0, 255, 0.5);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="terminal-info">
        CORE_REAC_STATUS: DUAL_SYNC_ACTIVE<br>
        SYSTEM_MODE: GEOMETRIC_INTERFERENCE_TEST<br>
        LQ_SCORE: <span id="lq-display">1.00</span><br>
        ORB_EMISSION: <span id="orb-display">0</span>/40
    </div>

    <div id="interaction-alert">Halte [ V ] gedrückt um das Gewebe zu vergiften</div>

    <!-- MODULE 1: DIE MATHEMATISCHE MATRIX -->
    <div id="matrix-container">
        <svg id="matrix-core" viewBox="0 0 500 500">
            <g id="layer-alpha">
                <path d="M 250 50 Q 400 100 450 250 Q 400 400 250 450 Q 100 400 50 250 Q 100 100 250 50 Z" fill="#00ffc8" opacity="0.15"/>
            </g>
            <g id="layer-beta">
                <path d="M 250 80 Q 380 150 420 250 Q 380 350 250 420 Q 120 350 80 250 Q 120 150 250 80 Z" fill="#8c00ff" opacity="0.12" style="mix-blend-mode: screen;"/>
            </g>
            <g id="orb-pool-group"></g>
        </svg>
    </div>

    <!-- MODULE 2: DAS ECHTE COMPACT WIDGET (DEIN ORIGINAL LOOK) -->
    <div id="widget-container">
        <svg id="widget-core" viewBox="0 0 300 300">
            <defs>
                <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00ffc8" />
                    <stop offset="100%" stop-color="#00aaff" />
                </linearGradient>
                <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8c00ff" />
                    <stop offset="100%" stop-color="#ff00aa" />
                </linearGradient>
                <linearGradient id="metal-shine" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="30%" stop-color="rgba(255,255,255,0.4)" />
                    <stop offset="50%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>
            </defs>
            <!-- Dein echtes Widget-Gewebe -->
            <g id="widget-body">
                <!-- Die organischen, weichen Kurven -->
                <path d="M 150 40 C 210 30, 260 90, 250 150 C 240 210, 210 260, 150 250 C 90 240, 40 210, 50 150 C 60 90, 90 50, 150 40 Z" fill="url(#cyan-grad)" opacity="0.8"/>
                <path d="M 150 60 C 200 50, 240 100, 230 150 C 220 200, 190 240, 150 230 C 110 220, 60 200, 70 150 C 80 100, 100 70, 150 60 Z" fill="url(#purple-grad)" opacity="0.6" style="mix-blend-mode: screen;"/>
                <line x1="50" y1="50" x2="250" y2="250" stroke="url(#metal-shine)" stroke-width="50" style="mix-blend-mode: overlay;" />
                <!-- Die kleinen Steuerpunkte auf der Umlaufbahn -->
                <circle cx="65" cy="115" r="4" fill="#fff" opacity="0.9" />
                <circle cx="235" cy="185" r="4" fill="#fff" opacity="0.9" />
                <!-- Die inneren Kernwellen -->
                <path d="M 130 150 Q 150 120 170 150" stroke="#00ffc8" stroke-width="3" fill="none" opacity="0.8"/>
                <path d="M 130 160 Q 150 190 170 160" stroke="#8c00ff" stroke-width="3" fill="none" opacity="0.8"/>
            </g>
        </svg>
    </div>

    <script>
    const layerAlpha = document.getElementById('layer-alpha');
    const layerBeta = document.getElementById('layer-beta');
    const widgetBody = document.getElementById('widget-body');
    const widgetContainer = document.getElementById('widget-container');
    const matrixCore = document.getElementById('matrix-core');
    const lqDisplay = document.getElementById('lq-display');
    const orbDisplay = document.getElementById('orb-display');

    // Kinetische Achsen
    let rotAlpha = 0;
    let rotBeta = 0;
    let rotWidget = 0;
    let whiteDotsRot = 0;
    
    let lqScore = 1.0;
    let isPoisoning = false;

    // Erzeuge den Plasma-Strahl dynamisch im globalen Dokumentenraum
    const plasmaBeam = document.createElement('div');
    plasmaBeam.style.position = 'absolute';
    plasmaBeam.style.height = '6px';
    plasmaBeam.style.background = 'linear-gradient(to right, #00ffc8, #8c00ff)';
    plasmaBeam.style.boxShadow = '0 0 20px #00ffc8, 0 0 10px #8c00ff';
    plasmaBeam.style.opacity = '0';
    plasmaBeam.style.transformOrigin = 'left center';
    plasmaBeam.style.zIndex = '4';
    document.body.appendChild(plasmaBeam);

    // Statischer Pool aus 40 vorgerenderten Teerblasen
    const MAX_ORBS = 40;
    const orbPool = [];
    const globalOrbContainer = document.createElement('div');
    globalOrbContainer.style.position = 'absolute';
    globalOrbContainer.style.top = '0'; globalOrbContainer.style.left = '0';
    globalOrbContainer.style.width = '100vw'; globalOrbContainer.style.height = '100vh';
    globalOrbContainer.style.pointerEvents = 'none'; globalOrbContainer.style.zIndex = '5';
    document.body.appendChild(globalOrbContainer);

    for(let i=0; i<MAX_ORBS; i++) {
        const div = document.createElement('div');
        div.style.position = 'absolute'; div.style.width = '12px'; div.style.height = '12px';
        div.style.borderRadius = '50%'; div.style.backgroundColor = '#050508';
        div.style.border = '2px solid rgba(0, 255, 200, 0.8)';
        div.style.boxShadow = '0 0 6px #00ffc8'; div.style.opacity = '0';
        globalOrbContainer.appendChild(div);
        orbPool.push({ element: div, active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0 });
    }

    window.addEventListener('keydown', (e) => { if(e.key.toLowerCase() === 'v') isPoisoning = true; });
    window.addEventListener('keyup', (e) => { if(e.key.toLowerCase() === 'v') isPoisoning = false; });

    // Haupt-Renderloop: Das Plasma-Kanonen-Protokoll
    function render() {
        // Koordinaten der Module abgreifen
        const matrixRect = document.getElementById('matrix-container').getBoundingClientRect();
        const middleRect = document.getElementById('widget-container').previousElementSibling?.getBoundingClientRect() || matrixRect; 
        const widgetRect = widgetContainer ? widgetContainer.getBoundingClientRect() : matrixRect;

        const mX = middleRect.left + middleRect.width / 2;
        const mY = middleRect.top + middleRect.height / 2;
        const lX = matrixRect.left + matrixRect.width / 2;
        const lY = matrixRect.top + matrixRect.height / 2;

        // Finde den exakten Zeiger (den Lichtkeil) im mittleren Element
        // Wir tricksen hier, indem wir das Element im DOM rotieren lassen
        const middleSVGGroup = layerBeta ? layerBeta.parentNode : null;

        if (isPoisoning) {
            lqScore = Math.max(0.05, lqScore - 0.015);
            const intensity = 1.0 - lqScore;

            // PHASE 2 & 3: Aufrichtung nach links & hochfrequente Schock-Vibration
            const zeigerWinkel = -45 + (intensity * 45); // Schwenkt von -45° auf exakt 0° (zielt stur nach links)
            const jitterX = (Math.random() - 0.5) * (intensity * 12);
            const jitterY = (Math.random() - 0.5) * (intensity * 12);

            if(middleSVGGroup) {
                middleSVGGroup.setAttribute('transform', `translate(${jitterX}, ${jitterY}) rotate(${zeigerWinkel} 250 250)`);
            }

            // Die zwei weißen Punkte auf der Außenbahn drehen sich rasend schnell
            whiteDotsRot += intensity * 25;
            // (In der echten Implementierung greifen wir hier die Kreise des SVG ab)

            // PHASE 4: Plasma-Kanonen-Strahl zünden (Schießt von Mitte nach Links)
            if(intensity > 0.3) {
                plasmaBeam.style.opacity = '1';
                plasmaBeam.style.left = `${mX}px`;
                plasmaBeam.style.top = `${mY}px`;
                
                const distance = Math.sqrt(Math.pow(lX - mX, 2) + Math.pow(lY - mY, 2));
                const angle = Math.atan2(lY - mY, lX - mX);
                
                plasmaBeam.style.width = `${distance}px`;
                plasmaBeam.style.transform = `rotate(${angle}rad) scaleY(${0.5 + intensity * 2})`;
                
                // Links wird das Kraftfeld durch den Plasmastrahl energetisiert und rotiert wild
                rotAlpha -= intensity * 15;
                if(layerAlpha) layerAlpha.setAttribute('transform', `rotate(${rotAlpha} 250 250)`);

                // ORB-SPAWN AUS DEM LINKEN REAKTOR DURCH DEN PLASMA-EINSCHLAG
                if(Math.random() > lqScore) {
                    const freeOrb = orbPool.find(o => !o.active);
                    if(freeOrb) {
                        freeOrb.x = lX + (Math.random() - 0.5) * 60;
                        freeOrb.y = lY + (Math.random() - 0.5) * 60;
                        
                        // Orbs driften unruhig aus dem linken Kraftfeld heraus
                        const driftAngle = Math.random() * Math.PI * 2;
                        freeOrb.vx = Math.cos(driftAngle) * (2 + intensity * 4);
                        freeOrb.vy = Math.sin(driftAngle) * (2 + intensity * 4);
                        freeOrb.life = 1.0;
                        freeOrb.active = true;
                        freeOrb.element.style.opacity = '1';
                    }
                }
            }
        } else {
            // SINKFLUG IN DEN INAKTIVEN STATUS
            lqScore = Math.min(1.0, lqScore + 0.02);
            const intensity = 1.0 - lqScore;
            
            plasmaBeam.style.opacity = '0';
            
            // Zeiger hängt wieder kraftlos auf -45 Grad nach unten weg
            const zeigerWinkel = -45 + (intensity * 45);
            if(middleSVGGroup) {
                middleSVGGroup.setAttribute('transform', `rotate(${zeigerWinkel} 250 250)`);
            }
        }
        
        if(lqDisplay) lqDisplay.innerText = lqScore.toFixed(2);

        // ZIRKULÄRER ORB-TRANSIT & ABSTERBEN
                // ORB-VERLAUF & RECYCLING IM SPEICHER ABARBEITEN
        let activeCount = 0;
        orbPool.forEach(orb => {
            if(orb.active) {
                activeCount++;
                orb.x += orb.vx;
                orb.y += orb.vy;
                orb.life -= 0.015;

                const orbJitter = (1.0 - lqScore) * 3;
                const oX = orb.x + (Math.random() - 0.5) * orbJitter;
                const oY = orb.y + (Math.random() - 0.5) * orbJitter;

                orb.element.style.left = `${oX}px`;
                orb.element.style.top = `${oY}px`;

                if(orb.life <= 0) {
                    orb.active = false;
                    orb.element.style.opacity = '0';
                } else if (orb.life < 0.3) {
                    orb.element.style.opacity = (orb.life / 0.3);
                }
            }
        });
        if(orbDisplay) orbDisplay.innerText = activeCount;

        // SCHLEIFE IM RENDERLOOP HALTEN
        requestAnimationFrame(render);
    }

    // INITIALER STARTSCHUSS FÜR DEN REAKTOR
    requestAnimationFrame(render);
</script>

</body>
</html>
